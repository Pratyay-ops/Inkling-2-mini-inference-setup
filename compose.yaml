# Inkling 2 Mini on one DGX Spark / GB10 (MSI EdgeXpert): vLLM behind an nginx auth proxy.
# All tunables live in .env (copy .env.example). Start with scripts/up.sh, not `docker compose up`
# directly, so secrets are created and the memory preflight runs first.
#
#   client ──▶ proxy :PORT (per-client keys, allowlist, limits) ──backend net──▶ vllm :8000 (internal key)
#
# vllm publishes no port and sits only on an internal network with no route out: it can't be reached
# from the LAN, and it can't be used to fetch URLs inside the corporate network (no SSRF via image_url).
name: inkling

services:
  vllm:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE in .env}
    container_name: inkling-2-mini
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: 16gb
    ulimits:
      memlock: -1
      stack: 67108864
    networks: [backend]
    entrypoint: ["bash", "/opt/inkling/serve.sh"]
    secrets:
      - source: internal_key
        target: api_key
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      VLLM_CACHE_ROOT: /vllm-cache
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      MODEL_ID: ${MODEL_ID:-thinkingmachines/Inkling-2-Mini}
      MODEL_REVISION: ${MODEL_REVISION:?set MODEL_REVISION in .env}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-inkling-2-mini}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-32}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.45}
      KV_CACHE_DTYPE: ${KV_CACHE_DTYPE:-auto}
      SPEC_DECODE: ${SPEC_DECODE:-dspark}
      CACHE_IDLE_MINUTES: ${CACHE_IDLE_MINUTES:-15}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    volumes:
      - ./docker/serve.sh:/opt/inkling/serve.sh:ro
      - ${HF_HOME_DIR:?set HF_HOME_DIR in .env}:/hf:ro
      - ${VLLM_CACHE_DIR:?set VLLM_CACHE_DIR in .env}:/vllm-cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold start is ~4-7 min (weights, torch.compile, CUDA graphs for target + DSpark drafter).
      start_period: 20m
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  proxy:
    image: ${PROXY_IMAGE:?set PROXY_IMAGE in .env}
    container_name: inkling-proxy
    restart: unless-stopped
    depends_on: [vllm, reaper]
    networks: [frontend, backend]
    ports:
      # Docker-published ports bypass ufw. BIND_ADDRESS=127.0.0.1 keeps it local-only.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8080"
      # Funnel ingress for the host's Tailscale (scripts/funnel.sh). Always localhost-only: this listener
      # trusts X-Forwarded-For so per-IP limits see real public callers.
      - "127.0.0.1:${FUNNEL_PORT:-8001}:8081"
    environment:
      NGINX_ENVSUBST_FILTER: "^PROXY_"
      PROXY_RATE_PER_KEY: ${PROXY_RATE_PER_KEY:-20r/s}
      PROXY_BURST_PER_KEY: ${PROXY_BURST_PER_KEY:-40}
      PROXY_MAX_CONCURRENT_PER_KEY: ${PROXY_MAX_CONCURRENT_PER_KEY:-64}
      PROXY_RATE_PER_IP: ${PROXY_RATE_PER_IP:-30r/s}
      PROXY_MAX_BODY: ${PROXY_MAX_BODY:-32m}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-3600s}
    volumes:
      # Both templates (main config + shared server body) are rendered by the image's envsubst step.
      - ./nginx:/etc/nginx/templates:ro
      # Directory mount (not single files) so key changes from scripts/keys.sh are seen on reload.
      - ${SECRETS_DIR:?set SECRETS_DIR in .env}/nginx:/etc/nginx/inkling:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d, /tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m
    logging: *logging

  # Wipes vLLM's caches after CACHE_IDLE_MINUTES without API requests and wakes it on the next one
  # (docker/cache_reaper.py). nginx asks it before forwarding each API request; /health doesn't count.
  reaper:
    image: ${REAPER_IMAGE:?set REAPER_IMAGE in .env}
    container_name: inkling-reaper
    restart: unless-stopped
    depends_on: [vllm]
    networks: [backend]
    user: "65534:65534"
    command: ["python3", "-I", "/opt/inkling/cache_reaper.py"]
    environment:
      CACHE_IDLE_MINUTES: ${CACHE_IDLE_MINUTES:-15}
      VLLM_URL: http://vllm:8000
    volumes:
      - ./docker/cache_reaper.py:/opt/inkling/cache_reaper.py:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

networks:
  frontend: {}
  backend:
    internal: true

secrets:
  internal_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/internal-key
